# Pages CMS 配置（https://pagescms.org）
# 这个文件决定编辑器里有哪些栏目、每个栏目的表单长什么样。
# 访客访问官网时不会读它，也不会因此产生任何外部请求。
#
# 改完这个文件后如果编辑器里的表单没跟着变：
# 左侧 Configuration → 打开 → 在最下面加一行注释 → Save，编辑器会重新读一遍。

media:
  input: assets/img
  output: assets/img
  categories: [image]

settings:
  # 保存时保留表单里没列出的字段，避免把数据里其他键冲掉
  content:
    merge: true
  commit:
    templates:
      create: "新增 {path}（{userName} 通过网页后台）"
      update: "更新 {path}（{userName} 通过网页后台）"
      delete: "删除 {path}（{userName} 通过网页后台）"
      rename: "重命名 {oldPath} → {newPath}（{userName} 通过网页后台）"

content:
  # ================= 公告 =================
  - name: announcements
    label: 公告
    type: file
    path: content/announcements.json
    fields:
      - name: announcements
        label: 公告列表（点标题展开填内容；列表只显示标题和日期）
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} · {date}"
        fields:
          - name: id
            label: 标识（英文小写，定了就别再改）
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9][a-z0-9-]*$"
              message: 只能用小写字母、数字和短横线，例如 new-year-2027（不能有空格和中文）
            description: |
              网址里会用这个编号：article.html?id=你的标识
              标题以后改了没关系，编号定了就不要再改，否则别人收藏的链接会失效。
              起名建议：日期 + 主题，例如 2027-01-new-textures。
          - name: date
            label: 日期
            type: date
            options:
              format: yyyy-MM-dd
            description: |
              点一下选日期，月日会自动补 0（不要手打）。
              列表按「置顶 → 日期从新到旧」排，跟拖动顺序无关。
          - name: title
            label: 标题（一句话说清是什么事）
            type: string
            required: true
            description: |
              这条标题会出现在：公告列表、浏览器标签页、分享出去的卡片。
              别写「更新公告」这种看不出内容的；写「三级域名开放申请」这种一眼就懂的。
          - name: color
            label: 卡片颜色（只影响列表左边那根竖条）
            type: select
            options:
              values:
                - name: gold
                  label: 金 · 站点动态
                - name: diamond
                  label: 钻 · 制度、规则
                - name: green
                  label: 绿 · 招募、活动
                - name: redstone
                  label: 红石 · 里程碑
            description: 拿不准就选「金 · 站点动态」。
          - name: tags
            label: 标签（筛选按钮用，多个用英文逗号隔开）
            type: string
            description: |
              公告页顶部那排筛选按钮就是这些标签。
              现成的词：站点 / 招募 / 代投 / 版本发布 / 合作 / 里程碑。
              尽量从最近几条里复制，写错字会导致点筛选找不到它。
          - name: pin
            label: 置顶
            type: boolean
            description: 打开后一直排在最前面，适合长期有效的制度类公告；不长期的就别开。
          - name: body
            label: 正文
            type: rich-text
            description: |
              正文怎么写（不会 Markdown / HTML 也能写，全部点按钮就行）

              【加粗】选中文字 → 点工具栏的 B。一句里挑关键字，别整段加粗。
              【小标题】把小标题单独写成一行 → 选中 → 点「标题 2」。下面空一行再写正文。
              【列表】每行一条 → 全选 → 点列表按钮。一条别超过两行，长了就拆。
              【插图】光标放到要插图的位置 → 点图片按钮 → 上传。
                     图片会存进 assets/img/，要求：宽 1200 左右、单张 500KB 以内、
                     文件名英文小写加短横线（例 news-2027-banner.jpg）。
                     别用中文名、空格、括号，老浏览器会打不开。
              【链接】选中文字 → 点链接按钮 → 粘贴网址。站外链接会自动新窗口打开。
              【分段】回车换行；连按两次回车（空一行）才是新的一段。
              【撤销】Ctrl + Z，改坏了先按它。

              不能做的：
              · 字号：站里只有正文和小标题两种，没有字号按钮
              · 下划线、彩色字：中文正文里显乱，强调一律用加粗
              · 表格、代码块：会把公告版式打乱
              · 首行缩进：不要敲空格，排版由样式统一处理

              写完检查一遍：
              · 第一句直接说清是什么事（列表只显示开头约 96 个字）
              · 图片说明写「图里是什么」，读屏和搜索会用到
              · 保存后约 1 分钟生效，强刷页面再看
              · 误点右上角「源码」不要紧，点回「预览」就行

              正文模板（直接套，把中文换成你的内容）：

              第一句说清这件事是什么。

              ## 具体安排

              - 时间：2027 年 1 月 20 日
              - 地点 / 方式：官网 toolbox
              - 参与条件：全体成员

              ## 需要你做的

              - 第一步
              - 第二步

              有问题在反馈群 1017068586 里问。

  # ================= 代表作品 =================
  # 只覆盖「代表作品」这一栏。专题页与测试中作品各有各的排版，不在这里。
  - name: works
    label: 代表作品
    type: file
    path: content/works.json
    fields:
      - name: works
        label: 作品列表（拖左边把手调顺序，越靠上越靠前）
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          # ---------- 卡片：作品页与首页看到的那一格 ----------
          - name: id
            label: 标识（英文小写，定了就别再改）
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9][a-z0-9-]*$"
              message: 只能用小写字母、数字和短横线，例如 my-new-map（不能有空格和中文）
            description: |
              详情页地址是 work.html?id=你的标识。
              已上线的作品千万别改这个，改了旧链接就进兜底页。
          - name: title
            label: 作品名
            type: string
            required: true
            description: 卡片和详情页的大标题。英文名不要塞这里，写进「详情页类型行」或副标题。
          - name: img
            label: 封面图（卡片上那张横图）
            type: image
            required: true
            description: |
              宽 1200～1400 够用，单张压到 500KB 以内（站内工具箱能压）。
              文件名英文小写加短横线：wuming-1.jpg；别用中文、空格、括号。
              同一件作品的截图依次叫 wuming-1 / wuming-2 / wuming-3。
          - name: category
            label: 类型（卡片左上角那颗小标签）
            type: select
            options:
              values:
                - name: shader
                  label: 光影
                - name: map
                  label: 地图
                - name: skin
                  label: 皮肤
                - name: tex
                  label: 材质
                - name: addon
                  label: Addon
            description: 只影响卡片上那颗标签和筛选按钮；详情页顶部那行分类在下面的「详情页」里单独写。
          - name: meta
            label: 作者与署名
            type: string
            description: 写真人名，不写开发组。格式：作者：创想时代 Log_坤。两个人的话用「、」隔开。
          - name: desc
            label: 一句话简介（卡片上那句话，不写句号）
            type: text
            description: 一句话讲清这是什么、主打什么。别写「这是一件优秀的作品」这种空话。详情页副标题留空时会自动用它。

          # ---------- 详情页：点「查看详情」打开的那一页 ----------
          - name: detail
            label: 详情页（可选填；不填就只有卡片）
            type: object
            description: |
              这一组决定 work.html?id=你的标识 那一页长什么样。
              只填一部分也能保存，缺的部分会留空或用卡片字段顶上。
            fields:
              - name: author
                label: 详情页作者
                type: string
                description: 详情页顶部那行「作者：…」。留空就不显示这一行。
              - name: type
                label: 详情页类型行
                type: string
                description: 标题上面那行，格式「中文 / English」，例如：光影 / Shader、地图 / Map、材质 / Texture（PVP）。
              - name: tagline
                label: 详情页副标题
                type: text
                description: 标题下面那句定位。留空会自动用卡片上那句简介。
              - name: cover
                label: 详情页大图
                type: image
                description: 不填就用卡片封面。要求同上：横图、500KB 以内、英文文件名。
              - name: coverAlt
                label: 大图说明
                type: string
                description: 不显示在页面上，只给读屏和搜索用。写「图里画了什么」，例如：晴天樱花树下的草地与花簇。
              - name: facts
                label: 右栏信息栏
                type: object
                description: |
                  详情页右侧那张小表，一行一项：项目 + 内容。
                  常用项目：作品名 / 作者 / 类型 / 平台 / 价格 / 下载渠道。
                  不确定的信息不要写，宁可少一行；写错比写少更麻烦。
                list:
                  collapsible:
                    collapsed: true
                    summary: "{k}"
                  fields:
                    - name: k
                      label: 项目
                      type: string
                    - name: v
                      label: 内容
                      type: string
                    - name: bold
                      label: 加粗显示
                      type: boolean
              - name: body
                label: 详情页正文
                type: rich-text
                options:
                  format: markdown
                description: |
                  怎么写（不会 Markdown 也能用，全部点按钮）

                  【加粗】选中文字 → 点 B。只挑关键字加粗。
                  【小标题】单独一行 → 选中 → 点「标题 2」。
                        满三个小标题时，页面右上会自动出现「本页目录」。
                  【列表】每行一条 → 全选 → 点列表按钮。
                  【插图】点图片按钮上传，自动插入。连着插两张会并排成一组。
                  【链接】选中文字 → 点链接按钮粘贴网址，站外自动新窗口。
                  【分段】回车换行，空一行才是新段落。

                  不能做的：字号只有正文与小标题两级；下划线不用；表格、代码块会打乱版式。

                  正文模板（直接套）：

                  一句话讲清这件作品是什么、适合谁用。

                  ## 特性

                  - 特性一
                  - 特性二
                  - 特性三

                  ## 推荐配置

                  设备或环境要求写在这里，不确定就不写。

                  ## 已知问题

                  - 问题一，以及临时绕过的办法

                  后续更新会写在这里。
              - name: shots
                label: 截图（页面底部可点开放大的那一组）
                type: object
                description: |
                  按顺序排，第一张就是第一张图。
                  同一批图加同样的「分组名」，页面上会插一条小标题分开（例如 基岩版 / Java 版）。
                  「说明」不显示在页面上，只给读屏用，写清这张图展示了什么。
                list:
                  collapsible:
                    collapsed: true
                    summary: "{group}"
                  fields:
                    - name: img
                      label: 图
                      type: image
                    - name: alt
                      label: 说明（不显示，只给读屏）
                      type: string
                    - name: group
                      label: 分组名（留空就接着上一组）
                      type: string
              - name: poster
                label: 海报（可选）
                type: image
                description: 成品海报或长图，显示在正文最前面。不填就没有这一块。
              - name: posterAlt
                label: 海报说明
                type: string
                description: 不显示，只给读屏用；写清海报里是什么内容。
              - name: notice
                label: 使用须知（可选）
                type: text
                description: 会渲染成一条提示条，适合写「不要在整合包里二次分发」这类注意事项；没有就留空。
              - name: thanks
                label: 鸣谢（可选）
                type: object
                description: 详情页底部的鸣谢表，一行一项：项目 + 内容。例如：测试 → 某某、素材 → 某某。
                list:
                  collapsible:
                    collapsed: true
                    summary: "{k}"
                  fields:
                    - name: k
                      label: 项目
                      type: string
                    - name: v
                      label: 内容
                      type: string

  # ================= 专题页 =================
  # work-rich.html 的正文。排版固定，作者只改文字与图片。
  # 字段刻意做成「平的」：没有任何嵌套列表，输入框都能直接打字。
  - name: topics
    label: 专题页
    type: file
    path: content/topic-pages.json
    fields:
      - name: pages
        label: 专题页列表（点名字展开填内容）
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: id
            label: 标识（和旧链接对应，别改）
            type: string
            required: true
            description: work-rich.html?id=你的标识。已上线的不要改，改了旧链接会失效。
          - name: name
            label: 作品名（页面大标题）
            type: string
            required: true
          - name: type
            label: 类型行（标题上方那行）
            type: string
            description: 格式「中文 / English」，例如：地图 / Map、材质 / Texture。
          - name: displayEn
            label: 英文装饰字（标题上方那两行大字）
            type: string
            description: 想分两行就在中间加一个竖线 |，例如 SEADREAM | VOYAGER；不加就按空格断行。
          - name: tagline
            label: 副标题（大标题下面那句）
            type: text
            description: 一句话定位，不写句号。
          - name: author
            label: 作者
            type: string
            description: 写真人名，格式：作者：某某。不写开发组。
          - name: cover
            label: 顶图（页面最上面那张大图）
            type: image
            description: 横图，宽 1600～1920 最稳；单张压到 600KB 以内，文件名英文小写加短横线。
          - name: coverAlt
            label: 顶图说明（不显示，只给读屏与搜索）
            type: string
          - name: factsText
            label: 作品信息（页面上那几张数字卡片）
            type: text
            description: |
              一行一项，写成「项目 | 内容」，例如：

              版本 | V14.FN
              关卡数 | 56
              平台 | 基岩版 / Java 版

              竖线是中文输入法里的 |，或者英文的 | 都行。
              不确定的不要写，宁可少一行。
          - name: body
            label: 正文（用 ## 分节，每节自动编号并进右上目录）
            type: rich-text
            options:
              format: markdown
            description: |
              一整个正文写在这一栏里，用 ## 开头就是新的一节。写法：

              开头这几段是导语，会显示在第一个分节之前。

              ## 前言

              这一节的内容。空行分段；- 开头是列表；![](图片) 插图（连着两张会并排）。

              ## 版本要求

              再一节的内容。

              ## 下载

              这一节只放按钮的话，正文可以留空，按钮用下面「按钮」那栏写。

              规矩：
              · 一节只讲一件事，标题四到八个字
              · 字号只有正文与小标题两级，没有下划线，强调用加粗
              · 图片宽 1200 左右、单张 500KB 以内、文件名英文小写加短横线
              · 想删掉哪一节，把它的 ## 标题连同内容一起删掉即可
          - name: linksText
            label: 按钮（一行一个）
            type: text
            description: |
              一行一个按钮，四段用竖线隔开：

              挂在哪一节 | 分组标题 | 按钮文字 | 网址

              例子：
              下载 |  | 百度网盘 | https://pan.baidu.com/xxxx
              下载 | 作者主页 | B 站 | https://space.bilibili.com/xxxx
               | 网易版（中国版） | 四合一 | https://resource-minecraft.h5.163.com/xxxx

              说明：
              · 第一段写「哪一节」，要和正文里的 ## 标题一字不差；留空就放到页面最底部的「下载与链接」
              · 第二段是分组标题，可以留空
              · 按钮顺序＝这里的行顺序
              · 网址必须以 http 或 https 开头；站外链接自动新窗口打开
