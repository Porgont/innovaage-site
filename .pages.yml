# Pages CMS 配置（https://pagescms.org）
# 这个文件决定编辑器里有哪些栏目、每个栏目的表单长什么样。
# 访客访问官网时不会读它，也不会因此产生任何外部请求。
#
# 用法：打开 https://app.pagescms.org → 选本仓库 → 左侧出现「公告」「代表作品」两个栏目。

media:
  input: assets/img
  output: assets/img
  categories: [image]

content:
  # ---------------- 公告 ----------------
  - name: announcements
    label: 公告
    type: file
    path: content/announcements.json
    fields:
      - name: announcements
        label: 公告列表
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} · {date}"
        fields:
          - name: id
            label: 标识（英文小写，全站唯一，链接会用到；例如 new-year-2027）
            type: string
            required: true
          - name: date
            label: 日期
            type: date
            options:
              format: yyyy-MM-dd
          - name: title
            label: 标题
            type: string
            required: true
          - name: color
            label: 卡片颜色
            type: select
            options:
              values:
                - name: gold
                  label: 金（站点动态）
                - name: diamond
                  label: 钻（制度、规则）
                - name: green
                  label: 绿（招募、活动）
                - name: redstone
                  label: 红石（里程碑）
          - name: tags
            label: 标签（多个用逗号隔开；筛选用，例如 招募,代投）
            type: string
          - name: pin
            label: 置顶
            type: boolean
          - name: body
            label: 正文
            type: rich-text
            options:
              format: markdown

  # ---------------- 代表作品 ----------------
  # 只覆盖「代表作品」这一栏。专题页与测试中作品各有各的排版，不在这里。
  - name: works
    label: 代表作品
    type: file
    path: content/works.json
    fields:
      - name: works
        label: 作品列表（顺序就是首页与作品页上的顺序）
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: id
            label: 标识（英文小写，全站唯一；有详情页时必须和详情页 id 一致）
            type: string
            required: true
          - name: title
            label: 作品名
            type: string
            required: true
          - name: img
            label: 封面图（横图，宽度别超过 1400，大小控制在 300KB 以内）
            type: image
          - name: category
            label: 类型
            type: select
            options:
              values:
                - name: shader
                  label: 光影
                - name: map
                  label: 地图
                - name: skin
                  label: 皮肤
                - name: tex
                  label: 材质
                - name: addon
                  label: Addon
          - name: meta
            label: 作者与署名（例如 作者：创想时代 Log_坤）
            type: string
          - name: desc
            label: 一句话简介（不写句号）
            type: text

          # —— 以下是详情页（点「查看详情」看到的那一页）——
          - name: author
            label: 详情页作者（例如 创想时代 Log_坤）
            type: string
          - name: type
            label: 详情页类型行（例如 光影 / Shader）
            type: string
          - name: tagline
            label: 详情页副标题（标题下面那句）
            type: text
          - name: cover
            label: 详情页大图（不填就用上面的封面图）
            type: image
          - name: coverAlt
            label: 大图说明（给读屏和搜索用，一句话）
            type: string
          - name: facts
            label: 右栏信息栏（每行一项，例如 作者 / 类型 / 平台）
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{k}"
              fields:
                - name: k
                  label: 项目
                  type: string
                - name: v
                  label: 内容
                  type: string
                - name: bold
                  label: 加粗显示
                  type: boolean
          - name: body
            label: 正文（Markdown：空行分段、## 小标题、- 列表、![](图片) 插图）
            type: rich-text
            options:
              format: markdown
          - name: shots
            label: 截图（页面底部那一组，可点开放大）
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{group}"
              fields:
                - name: img
                  label: 图
                  type: image
                - name: alt
                  label: 说明（不显示，只给读屏用）
                  type: string
                - name: group
                  label: 分组名（留空就接着上一组）
                  type: string
          - name: poster
            label: 海报（可选，正文最前面的大图）
            type: image
          - name: posterAlt
            label: 海报说明
            type: string
          - name: notice
            label: 使用须知（可选，红色提示条）
            type: text
          - name: thanks
            label: 鸣谢（可选）
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{k}"
              fields:
                - name: k
                  label: 项目
                  type: string
                - name: v
                  label: 内容
                  type: string
                  # 2026-10-20 更新
